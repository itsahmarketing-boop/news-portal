<!doctype html><html lang="bn" data-lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AH Marketing News — অর্থনীতি, ইসলামী অর্থনীতি ও সর্বশেষ</title>

<meta property="og:title" content="AH Marketing News"><meta property="og:type" content="website"><meta property="og:site_name" content="AH Marketing News">

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#6d4aff;--deep:#241a52;--mid:#4a2fb0;--gold:#c9a24a;--gold2:#e0bd6a;--paper:#f6f5fb;--card:#fff;--ink:#16132a;--muted:#6c6886;--line:#e5e2f1}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--paper);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.6}
html[data-lang="en"] body{font-family:"Inter",system-ui,sans-serif}.wrap{max-width:1140px;margin:0 auto;padding:0 20px}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
.top{background:#fff;border-bottom:1px solid var(--line)}.top-in{max-width:1140px;margin:0 auto;padding:8px 20px;display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.lang{display:inline-flex;border:1px solid #d9d4ea;border-radius:999px;overflow:hidden}.lang button{border:0;background:transparent;padding:4px 12px;font:inherit;font-size:12px;cursor:pointer;color:var(--muted)}.lang button.on{background:var(--brand);color:#fff}
.mh{text-align:center;padding:20px;background:#fff;border-bottom:2px solid var(--brand)}.mh .mono{font-family:"Inter";letter-spacing:.3em;font-size:11px;color:var(--gold);font-weight:700;text-transform:uppercase}.mh h1{margin:6px 0 2px;font-family:"Noto Serif Bengali",serif;font-weight:800;font-size:clamp(30px,6vw,52px);color:var(--deep)}html[data-lang="en"] .mh h1{font-family:Georgia,serif}.mh .tag{font-size:13px;color:var(--muted)}
.ticker{display:flex;background:var(--deep);color:#fff;overflow:hidden}.ticker .lbl{display:flex;align-items:center;gap:7px;background:#d7263d;padding:9px 14px;font-weight:700;font-size:13px;white-space:nowrap}.ticker .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.25}}.ticker .run{flex:1;overflow:hidden}.ticker .track{display:inline-flex;white-space:nowrap;padding:9px 0;font-size:13.5px;animation:tk 36s linear infinite}.ticker .run:hover .track{animation-play-state:paused}.ticker .track span{padding:0 26px}@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
nav.sec{position:sticky;top:0;z-index:20;background:var(--mid)}nav.sec ul{list-style:none;margin:0 auto;padding:0 20px;max-width:1140px;display:flex;gap:2px;overflow-x:auto}nav.sec a{display:block;padding:12px 15px;font-size:14px;font-weight:600;white-space:nowrap;color:#e4dffb;border-bottom:3px solid transparent}nav.sec a:hover{color:#fff;border-color:var(--gold2)}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:10px;background:linear-gradient(135deg,var(--deep),var(--brand))}.thumb img{width:100%;height:100%;object-fit:cover}.thumb.noimg img{display:none}.thumb .mk{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#fff;font-family:Georgia,serif;letter-spacing:.2em;font-weight:700;font-size:12px;opacity:.6}.thumb.noimg .mk{display:flex}.kchip{position:absolute;left:8px;top:8px;background:var(--gold);color:#1a1405;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;padding:24px 0 6px}.lead h2{font-family:"Noto Serif Bengali",serif;font-weight:800;font-size:clamp(23px,3.3vw,34px);line-height:1.22;margin:12px 0 8px}html[data-lang="en"] .lead h2{font-family:Georgia,serif}.lead .dek{color:#39334f;font-size:16px;margin:0 0 8px}.meta{font-size:12.5px;color:var(--muted)}
.rail{border-left:1px solid var(--line);padding-left:22px}.rail h3{font-family:"Noto Serif Bengali",serif;color:var(--deep);font-size:18px;margin:0 0 6px}.rail .pin{font-size:10px;background:var(--brand);color:#fff;padding:2px 7px;border-radius:999px}.rail ul{list-style:none;margin:8px 0 0;padding:0}.rail li{padding:11px 0;border-top:1px solid var(--line)}.rail li a{font-weight:600;font-size:14.5px}.rail li .m{font-size:11.5px;color:var(--muted);margin-top:3px}
section.block{padding:26px 0 4px}.sh{display:flex;align-items:center;gap:12px;margin:0 0 14px}.sh h2{margin:0;font-family:"Noto Serif Bengali",serif;font-size:21px;color:var(--deep)}html[data-lang="en"] .sh h2{font-family:Georgia,serif}.sh .bar{height:3px;flex:1;background:linear-gradient(90deg,var(--brand),transparent)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card h4{font-size:15.5px;font-weight:600;line-height:1.35;margin:9px 0 5px}.card p{font-size:13px;color:var(--muted);margin:0}.card .k{font-size:11px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.05em}
footer{background:var(--deep);color:#cfc8ea;margin-top:36px;padding:28px 0}footer .brand{font-family:"Noto Serif Bengali",serif;font-weight:800;font-size:22px;color:#fff}footer a{color:#cfc8ea}footer .fine{border-top:1px solid #3a2f6b;margin-top:16px;padding-top:12px;font-size:12px;color:#9a92c0}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
@media(max-width:860px){.hero{grid-template-columns:1fr}.rail{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:16px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="top"><div class="top-in"><span id="dt"></span><span class="lang"><button id="bn" class="on" onclick="L('bn')">বাংলা</button><button id="en" onclick="L('en')">English</button></span></div></div>
<header class="mh"><div class="mono">Economy · Islamic Finance · Business</div><h1 data-bn="এএইচ মার্কেটিং নিউজ" data-en="AH Marketing News">এএইচ মার্কেটিং নিউজ</h1><div class="tag" data-bn="নির্ভরযোগ্য সূত্রে মৌলিক সংবাদ" data-en="Original reporting from trusted sources">নির্ভরযোগ্য সূত্রে মৌলিক সংবাদ</div></header>
<div class="ticker"><div class="lbl"><span class="dot"></span><span data-bn="সর্বশেষ" data-en="BREAKING">সর্বশেষ</span></div><div class="run"><div class="track" id="tk"></div></div></div>
<nav class="sec"><ul id="nav"></ul></nav>
<div class="wrap"><div class="hero"><div class="lead" id="lead"></div><aside class="rail" id="rail"></aside></div></div>
<div class="wrap" id="sections"></div>
<footer><div class="wrap"><div class="brand" data-bn="এএইচ মার্কেটিং নিউজ" data-en="AH Marketing News">এএইচ মার্কেটিং নিউজ</div><p style="font-size:13px"><a href="archive.html" data-bn="আর্কাইভ" data-en="Archive">আর্কাইভ</a> · <a href="feed.xml">RSS</a></p><div class="fine">© 2026 AH Marketing News · www.itsahmarketing.com</div></div></footer>
<script>
var CATS=[{k:"national",bn:"জাতীয়",en:"National"},{k:"economy",bn:"অর্থনীতি",en:"Economy"},{k:"islam",bn:"ইসলাম",en:"Islam"},{k:"world",bn:"বিশ্ব",en:"World"},{k:"business",bn:"ব্যবসা",en:"Business"},{k:"tech",bn:"প্রযুক্তি",en:"Technology"},{k:"sports",bn:"খেলা",en:"Sports"}];
var LANG="bn",DATA=[];
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function tx(it,f){return LANG==="en"?(it[f+"En"]||it[f+"Bn"]||""):(it[f+"Bn"]||it[f+"En"]||"")}
function thumb(it,chip){var img=it.img?("/"+it.img):"";var c=chip?('<span class="kchip">'+esc(catName(it.cat))+"</span>"):"";return '<div class="thumb"'+(img?"":' class="thumb noimg"')+'>'+(img?'<img src="'+esc(img)+'" onerror="this.closest(\'.thumb\').classList.add(\'noimg\')" alt="">':"")+c+'<div class="mk">AH MARKETING</div></div>'}
function catName(k){for(var i=0;i<CATS.length;i++)if(CATS[i].k===k)return LANG==="en"?CATS[i].en:CATS[i].bn;return k}
function card(it){return '<a class="card" href="'+esc(it.url||("a/"+it.id+".html"))+'">'+thumb(it,0)+'<div class="k">'+esc(catName(it.cat))+'</div><h4>'+esc(tx(it,"title"))+'</h4><p>'+esc(tx(it,"sum")||tx(it,"sub"))+'</p></a>'}
function render(){
  var d=new Date();document.getElementById("dt").textContent=d.toLocaleDateString(LANG==="en"?"en-GB":"bn-BD",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+" · "+(LANG==="en"?"Dhaka":"ঢাকা");
  document.querySelectorAll("[data-bn]").forEach(function(e){e.textContent=LANG==="en"?e.getAttribute("data-en"):e.getAttribute("data-bn")});
  var nav=CATS.map(function(c){return '<li><a href="#'+c.k+'">'+(LANG==="en"?c.en:c.bn)+"</a></li>"}).join("");document.getElementById("nav").innerHTML=nav;
  var brk=DATA.filter(function(x){return x.breaking}).concat(DATA).slice(0,6);var one=brk.map(function(it){return "<span>"+esc(tx(it,"title"))+"</span>"}).join("");document.getElementById("tk").innerHTML=one+one;
  var lead=DATA.filter(function(x){return x.lead})[0]||DATA[0];
  if(!lead){document.getElementById("lead").innerHTML='<div class="empty" data-bn="এখনো খবর যোগ করা হয়নি।" data-en="No news added yet.">এখনো খবর যোগ করা হয়নি।</div>';document.getElementById("rail").innerHTML="";document.getElementById("sections").innerHTML="";return}
  document.getElementById("lead").innerHTML='<a href="'+esc(lead.url||("a/"+lead.id+".html"))+'">'+thumb(lead,1)+"</a><h2>"+esc(tx(lead,"title"))+'</h2><p class="dek">'+esc(tx(lead,"sum")||tx(lead,"sub"))+'</p><div class="meta">'+esc(lead.author||"AH Marketing News")+" · "+esc((lead.date||"").slice(0,10))+"</div>";
  var isl=DATA.filter(function(x){return x.cat==="islam"||x.pinned}).slice(0,5);
  document.getElementById("rail").innerHTML="<h3>"+(LANG==="en"?"Islamic Finance":"ইসলামী অর্থনীতি")+' <span class="pin">'+(LANG==="en"?"PINNED":"পিন")+"</span></h3><ul>"+(isl.map(function(it){return "<li><a href=\""+esc(it.url||("a/"+it.id+".html"))+"\">"+esc(tx(it,"title"))+"</a><div class=\"m\">"+esc(catName(it.cat))+" · "+esc((it.date||"").slice(0,10))+"</div></li>"}).join("")||"<li class=\"m\">—</li>")+"</ul>";
  var sec=CATS.map(function(c){var items=DATA.filter(function(x){return x.cat===c.k}).slice(0,4);if(!items.length)return "";return '<section class="block" id="'+c.k+'"><div class="sh"><h2>'+(LANG==="en"?c.en:c.bn)+'</h2><div class="bar"></div></div><div class="grid">'+items.map(card).join("")+"</div></section>"}).join("");document.getElementById("sections").innerHTML=sec;
}
function L(l){LANG=l;document.documentElement.setAttribute("data-lang",l);document.documentElement.lang=l;document.getElementById("bn").classList.toggle("on",l==="bn");document.getElementById("en").classList.toggle("on",l==="en");try{localStorage.setItem("ahlang",l)}catch(e){}render()}
(function(){var s;try{s=localStorage.getItem("ahlang")}catch(e){}if(!s){try{s=(Intl.DateTimeFormat().resolvedOptions().timeZone==="Asia/Dhaka"||(navigator.language||"").toLowerCase().indexOf("bn")===0)?"bn":"en"}catch(e){s="bn"}}LANG=s;document.documentElement.setAttribute("data-lang",s);document.getElementById("bn").classList.toggle("on",s==="bn");document.getElementById("en").classList.toggle("on",s==="en");
fetch("/news.json?t="+Date.now()).then(function(r){return r.json()}).then(function(j){DATA=j||[];render()}).catch(function(){DATA=[];render()})})();
</script></body></html>
